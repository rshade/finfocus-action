name: 'finfocus-action'
description: 'Integrate finfocus into CI/CD workflows for cloud cost estimates'
author: 'rshade'
inputs:
  pulumi-plan-json:
    description: 'Path to the pulumi preview --json output file'
    required: false
    default: 'plan.json'
  github-token:
    description: 'GitHub Token for posting comments'
    required: false
    default: ${{ github.token }}
  finfocus-version:
    description: 'Version of finfocus to install. Tested against v0.4.0 and latest. "latest" resolves to the newest stable CLI release (v<major>.<minor>.<patch>), excluding plugin releases (kubernetes-*, jev-*), prerelease, and draft tags. May include breaking changes; pin a version for a stable target.'
    required: false
    default: 'latest'
  install-plugins:
    description: 'Comma-separated plugins to install. Registry names (aws-public, kubernetes, jev, kubecost, and name@version) are checked against `finfocus plugin list --available`. github.com/owner/repo specifiers are also accepted. kubernetes feeds cost cluster. jev scores recommendations and needs TYPESAFE_API_KEY.'
    required: false
    default: ''
  behavior-on-error:
    description: 'Behavior when an error occurs (fail, warn, silent)'
    required: false
    default: 'fail'
  post-comment:
    description: 'Whether to post a comment to the PR (true/false)'
    required: false
    default: 'true'
  fail-on-cost-increase:
    description: 'Threshold string (e.g., "100USD") to fail if diff exceeds'
    required: false
    default: ''
  analyzer-mode:
    description: 'If true, sets up environment for pulumi preview to use as analyzer'
    required: false
    default: 'false'
  detailed-comment:
    description: 'If true, provides a detailed breakdown of all resources and metadata in the PR comment'
    required: false
    default: 'false'
  include-recommendations:
    description: 'Include cost optimization recommendations in PR comment (true/false)'
    required: false
    default: 'true'
  log-level:
    description: 'Log level for finfocus (debug, info, warn, error)'
    required: false
    default: 'error'
  debug:
    description: 'If true, enables detailed debug logging for the action itself'
    required: false
    default: 'false'
  include-actual-costs:
    description: 'Include actual/historical costs in PR comment (true/false)'
    required: false
    default: 'false'
  actual-costs-period:
    description: 'Time period for actual costs: 7d, 30d, mtd (month-to-date), or custom YYYY-MM-DD'
    required: false
    default: '7d'
  pulumi-state-json:
    description: 'Path to Pulumi state JSON for state-based cost estimation'
    required: false
    default: ''
  terraform-state:
    description: 'Path to a Terraform state file (terraform.tfstate) for cost projection instead of a Pulumi plan; mutually exclusive with pulumi-plan-json (finfocus v0.4.0)'
    required: false
    default: ''
  actual-costs-group-by:
    description: 'Group actual costs by: resource, type, provider, daily, monthly'
    required: false
    default: 'provider'
  include-sustainability:
    description: 'Include carbon footprint and sustainability metrics (true/false)'
    required: false
    default: 'true'
  utilization-rate:
    description: 'Assumed utilization rate for sustainability calculations (0.0 to 1.0)'
    required: false
    default: '1.0'
  sustainability-equivalents:
    description: 'Show impact equivalents like trees, miles driven (true/false)'
    required: false
    default: 'true'
  fail-on-carbon-increase:
    description: 'Threshold (e.g., "10%", "10kg") to fail if carbon footprint increases'
    required: false
    default: ''
  budget-amount:
    description: 'Budget amount for cost tracking (e.g., 1000). Written as cost.budgets.global in ~/.finfocus/config.yaml so finfocus enforces it via --exit-on-threshold'
    required: false
    default: ''
  budget-currency:
    description: 'Budget currency code (e.g., USD)'
    required: false
    default: 'USD'
  budget-period:
    description: 'Budget period: monthly, quarterly, yearly'
    required: false
    default: 'monthly'
  budget-alerts:
    description: 'Budget alerts in JSON format: [{"threshold": 80, "type": "actual"}, {"threshold": 100, "type": "forecasted"}]'
    required: false
    default: ''
  estimate-spec:
    description: 'JSON spec for a single-resource what-if cost estimate via `finfocus cost estimate`, e.g. {"provider":"aws","resource_type":"aws:ec2/instance:Instance","properties":{"instanceType":"m5.large"},"region":"us-east-1"}. Empty disables the feature. Tested against finfocus v0.4.0.'
    required: false
    default: ''
  include-cluster-costs:
    description: 'Include a Kubernetes cluster cost section from `finfocus cost cluster` (finfocus v0.4.0+). Requires the kubernetes plugin and a kubeconfig on the runner.'
    required: false
    default: 'false'
  cluster-group-by:
    description: 'cost cluster --group-by: namespace, controller, pod, node, pulumi-stack, or label:<key> (finfocus v0.4.0+).'
    required: false
    default: 'namespace'
  cluster-namespace:
    description: 'Limit cost cluster to one namespace (omits idle and cluster rows). finfocus v0.4.0+.'
    required: false
    default: ''
  cluster-context:
    description: 'Kubeconfig context for cost cluster. Default is the current context. finfocus v0.4.0+.'
    required: false
    default: ''
  cluster-selector:
    description: 'Comma-separated pod label selectors (key=value) passed as repeatable cost cluster --selector. finfocus v0.4.0+.'
    required: false
    default: ''
  enable-jev-scoring:
    description: 'Opt in to Jev recommendation scoring (finfocus v0.4.0+). Writes scoring.enabled and scoring.plugin jev. Requires the jev plugin and a TYPESAFE_API_KEY environment variable. Scores are shown in the comment; they do not dismiss recommendations.'
    required: false
    default: 'false'
  include-dismissed-recommendations:
    description: 'Show dismissed and snoozed recommendations (passes --include-dismissed). Default false, so a PR comment does not repeat them. finfocus v0.4.0+.'
    required: false
    default: 'false'
  dismiss-recommendations:
    description: 'JSON array of recommendations to dismiss before the comment is built, e.g. [{"id":"rec-123","reason":"business-constraint"}]. Reasons: not-applicable, already-implemented, business-constraint, technical-constraint, deferred, inaccurate, other (other requires note). finfocus v0.4.0+.'
    required: false
    default: ''
  snooze-recommendations:
    description: 'JSON array of recommendations to snooze, e.g. [{"id":"rec-456","until":"2026-04-01","reason":"deferred"}]. until is YYYY-MM-DD or RFC3339. finfocus v0.4.0+.'
    required: false
    default: ''
  state-only:
    description: 'Run `finfocus overview --state-only --pulumi-state` so finfocus skips pulumi preview. Requires pulumi-state-json. This flag is on overview, not cost projected. When no plan or terraform state file exists, the overview total is used as the comment total. finfocus v0.3.5+ (tested on v0.4.0 and v0.4.3).'
    required: false
    default: 'false'
outputs:
  total-monthly-cost:
    description: 'The absolute projected monthly cost'
    value: ${{ steps.run.outputs.total-monthly-cost }}
  cost-diff:
    description: 'The difference in cost compared to the base state'
    value: ${{ steps.run.outputs.cost-diff }}
  currency:
    description: 'The currency code (e.g., USD)'
    value: ${{ steps.run.outputs.currency }}
  report-json-path:
    description: 'Path to the generated full JSON report'
    value: ${{ steps.run.outputs.report-json-path }}
  policy-pack-path:
    description: 'Path to the set up policy pack directory'
    value: ${{ steps.run.outputs.policy-pack-path }}
  actual-total-cost:
    description: 'Total actual cost for the specified period'
    value: ${{ steps.run.outputs.actual-total-cost }}
  actual-cost-period:
    description: 'The date range for actual costs (e.g., 2025-01-01 to 2025-01-07)'
    value: ${{ steps.run.outputs.actual-cost-period }}
  total-savings:
    description: 'Total potential monthly savings from recommendations'
    value: ${{ steps.run.outputs.total-savings }}
  recommendation-count:
    description: 'Total number of cost recommendations found'
    value: ${{ steps.run.outputs.recommendation-count }}
  total-carbon-footprint:
    description: 'Total estimated CO2 emissions (kgCO2e/month)'
    value: ${{ steps.run.outputs.total-carbon-footprint }}
  carbon-intensity:
    description: 'Carbon intensity per dollar spent (gCO2e/USD)'
    value: ${{ steps.run.outputs.carbon-intensity }}
  budget-spent:
    description: 'Current budget spend amount'
    value: ${{ steps.run.outputs.budget-spent }}
  budget-remaining:
    description: 'Remaining budget amount'
    value: ${{ steps.run.outputs.budget-remaining }}
  budget-percent-used:
    description: 'Percentage of budget used'
    value: ${{ steps.run.outputs.budget-percent-used }}
  unpriced-resource-count:
    description: 'Number of resources that could not be priced'
    value: ${{ steps.run.outputs.unpriced-resource-count }}
  cluster-total-cost:
    description: 'Monthly cluster cost from finfocus cost cluster, when include-cluster-costs is true'
    value: ${{ steps.run.outputs.cluster-total-cost }}
  state-projected-monthly:
    description: 'Projected monthly cost from finfocus overview --state-only, when state-only is true'
    value: ${{ steps.run.outputs.state-projected-monthly }}

runs:
  using: 'composite'
  steps:
    - name: 'Run finfocus-action'
      id: run
      run: node ${{ github.action_path }}/dist/index.js
      shell: bash
      env:
        INPUT_PULUMI_PLAN_JSON: ${{ inputs.pulumi-plan-json }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_FINFOCUS_VERSION: ${{ inputs.finfocus-version }}
        INPUT_INSTALL_PLUGINS: ${{ inputs.install-plugins }}
        INPUT_BEHAVIOR_ON_ERROR: ${{ inputs.behavior-on-error }}
        INPUT_POST_COMMENT: ${{ inputs.post-comment }}
        INPUT_FAIL_ON_COST_INCREASE: ${{ inputs.fail-on-cost-increase }}
        INPUT_ANALYZER_MODE: ${{ inputs.analyzer-mode }}
        INPUT_DETAILED_COMMENT: ${{ inputs.detailed-comment }}
        INPUT_INCLUDE_RECOMMENDATIONS: ${{ inputs.include-recommendations }}
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_INCLUDE_ACTUAL_COSTS: ${{ inputs.include-actual-costs }}
        INPUT_ACTUAL_COSTS_PERIOD: ${{ inputs.actual-costs-period }}
        INPUT_PULUMI_STATE_JSON: ${{ inputs.pulumi-state-json }}
        INPUT_TERRAFORM_STATE: ${{ inputs.terraform-state }}
        INPUT_ACTUAL_COSTS_GROUP_BY: ${{ inputs.actual-costs-group-by }}
        INPUT_INCLUDE_SUSTAINABILITY: ${{ inputs.include-sustainability }}
        INPUT_UTILIZATION_RATE: ${{ inputs.utilization-rate }}
        INPUT_SUSTAINABILITY_EQUIVALENTS: ${{ inputs.sustainability-equivalents }}
        INPUT_FAIL_ON_CARBON_INCREASE: ${{ inputs.fail-on-carbon-increase }}
        INPUT_BUDGET_AMOUNT: ${{ inputs.budget-amount }}
        INPUT_BUDGET_CURRENCY: ${{ inputs.budget-currency }}
        INPUT_BUDGET_PERIOD: ${{ inputs.budget-period }}
        INPUT_BUDGET_ALERTS: ${{ inputs.budget-alerts }}
        INPUT_ESTIMATE_SPEC: ${{ inputs.estimate-spec }}
        INPUT_INCLUDE_CLUSTER_COSTS: ${{ inputs.include-cluster-costs }}
        INPUT_CLUSTER_GROUP_BY: ${{ inputs.cluster-group-by }}
        INPUT_CLUSTER_NAMESPACE: ${{ inputs.cluster-namespace }}
        INPUT_CLUSTER_CONTEXT: ${{ inputs.cluster-context }}
        INPUT_CLUSTER_SELECTOR: ${{ inputs.cluster-selector }}
        INPUT_ENABLE_JEV_SCORING: ${{ inputs.enable-jev-scoring }}
        INPUT_INCLUDE_DISMISSED_RECOMMENDATIONS: ${{ inputs.include-dismissed-recommendations }}
        INPUT_DISMISS_RECOMMENDATIONS: ${{ inputs.dismiss-recommendations }}
        INPUT_SNOOZE_RECOMMENDATIONS: ${{ inputs.snooze-recommendations }}
        INPUT_STATE_ONLY: ${{ inputs.state-only }}
branding:
  icon: 'dollar-sign'
  color: 'blue'
