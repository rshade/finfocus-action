name: 'build-test'
on:
  pull_request:
  push:
    branches:
      - main
      - '001-*'
  schedule:
    # Daily so a breaking finfocus release shows up within a day
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: |
          npm install
      - run: |
          npm run lint
      - run: |
          npm test
      - run: |
          npm run build

  contract: # Real-binary contract test (AC-1.1/AC-1.2, issue #88)
    name: 'finfocus contract (${{ matrix.finfocus-version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        finfocus-version: ['v0.4.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - name: 'Install finfocus ${{ matrix.finfocus-version }} from GitHub release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finfocus"
          TAG="${{ matrix.finfocus-version }}"
          if [ "$TAG" = "latest" ]; then
            # Resolve latest to the highest stable v<major>.<minor>.<patch> release
            TAG=$(gh release list --repo rshade/finfocus --exclude-pre-releases --exclude-drafts --limit 100 --json tagName \
              | jq -r '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tagName' \
              | sort -V | tail -1)
            echo "Resolved latest to: $TAG"
          fi
          gh release download --repo rshade/finfocus "$TAG" \
            --pattern '*linux-amd64.tar.gz' --dir "$RUNNER_TEMP/finfocus"
          tar -xzf "$RUNNER_TEMP/finfocus"/*linux-amd64.tar.gz -C "$RUNNER_TEMP/finfocus"
          chmod +x "$RUNNER_TEMP/finfocus/finfocus"
          "$RUNNER_TEMP/finfocus/finfocus" --version
      - name: 'Run contract suite'
        env:
          FINFOCUS_BIN: ${{ runner.temp }}/finfocus/finfocus
        run: scripts/contract.sh
